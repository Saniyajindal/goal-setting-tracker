<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AtomQuest — Goal Setting & Tracking Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0a0c10;
  --surface: #111318;
  --surface2: #181c24;
  --surface3: #1e2330;
  --border: #252b38;
  --border2: #2e3545;
  --text: #e8eaf0;
  --text2: #9aa0b4;
  --text3: #5c6480;
  --accent: #4f8ef7;
  --accent2: #7c5cfc;
  --accent3: #00d4aa;
  --warn: #f7a14f;
  --danger: #f75f5f;
  --success: #4fd97a;
  --gold: #f7c94f;
  --card-shadow: 0 4px 24px rgba(0,0,0,0.5);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}
h1,h2,h3,h4,h5 { font-family: 'Syne', sans-serif; font-weight: 700; }

/* ---- SCROLLBAR ---- */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ---- LOGIN ---- */
#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse 80% 80% at 50% -20%, rgba(79,142,247,0.15), transparent),
              radial-gradient(ellipse 60% 60% at 80% 80%, rgba(124,92,252,0.1), transparent),
              var(--bg);
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 48px 40px;
  width: 420px;
  max-width: 95vw;
  box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
  animation: fadeUp 0.5s ease;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }
.login-logo {
  text-align: center;
  margin-bottom: 32px;
}
.login-logo .logo-icon {
  width: 56px; height: 56px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  margin-bottom: 12px;
  box-shadow: 0 8px 24px rgba(79,142,247,0.4);
}
.login-logo h1 { font-size: 22px; letter-spacing: -0.5px; }
.login-logo p { color: var(--text2); font-size: 13px; margin-top: 4px; }
.role-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 24px;
}
.role-tab {
  padding: 10px 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  font-family: 'Syne', sans-serif;
  color: var(--text2);
  transition: all 0.2s;
}
.role-tab:hover { border-color: var(--accent); color: var(--text); }
.role-tab.active { background: rgba(79,142,247,0.12); border-color: var(--accent); color: var(--accent); }
.role-tab .rticon { font-size: 18px; display: block; margin-bottom: 4px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(79,142,247,0.12);
}
.form-group select option { background: var(--surface2); }
.btn {
  padding: 10px 20px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
  font-size: 13px;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  box-shadow: 0 4px 16px rgba(79,142,247,0.35);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,142,247,0.45); }
.btn-secondary { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-success { background: rgba(79,217,122,0.15); border: 1px solid rgba(79,217,122,0.4); color: var(--success); }
.btn-success:hover { background: rgba(79,217,122,0.25); }
.btn-warn { background: rgba(247,161,79,0.15); border: 1px solid rgba(247,161,79,0.4); color: var(--warn); }
.btn-warn:hover { background: rgba(247,161,79,0.25); }
.btn-danger { background: rgba(247,95,95,0.15); border: 1px solid rgba(247,95,95,0.4); color: var(--danger); }
.btn-danger:hover { background: rgba(247,95,95,0.25); }
.btn-ghost { background: transparent; color: var(--text2); }
.btn-ghost:hover { color: var(--text); background: var(--surface2); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-full { width: 100%; justify-content: center; padding: 13px; font-size: 15px; }
.login-demo { margin-top: 16px; text-align: center; }
.login-demo p { font-size: 12px; color: var(--text3); }
.login-demo strong { color: var(--text2); }

/* ---- APP SHELL ---- */
#app { display: none; min-height: 100vh; flex-direction: row; }
#app.visible { display: flex; }

/* SIDEBAR */
.sidebar {
  width: 240px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0;
  height: 100vh;
  z-index: 100;
  overflow-y: auto;
}
.sidebar-logo {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo .logomark {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  margin-right: 10px;
  box-shadow: 0 4px 12px rgba(79,142,247,0.3);
  vertical-align: middle;
}
.sidebar-logo span { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; vertical-align: middle; }
.sidebar-user {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-user .su-name { font-weight: 600; font-size: 13px; }
.sidebar-user .su-role {
  font-size: 11px;
  color: var(--text2);
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 2px 8px;
  display: inline-block;
  margin-top: 4px;
  font-family: 'Syne', sans-serif;
  font-weight: 600;
}
.role-employee .su-role { color: var(--accent3); border-color: rgba(0,212,170,0.3); background: rgba(0,212,170,0.08); }
.role-manager .su-role { color: var(--accent); border-color: rgba(79,142,247,0.3); background: rgba(79,142,247,0.08); }
.role-admin .su-role { color: var(--gold); border-color: rgba(247,201,79,0.3); background: rgba(247,201,79,0.08); }
.sidebar-nav { flex: 1; padding: 12px 8px; }
.nav-section { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); padding: 8px 10px 4px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: rgba(79,142,247,0.12); color: var(--accent); }
.nav-item .ni-icon { font-size: 16px; width: 20px; text-align: center; }
.nav-item .ni-badge {
  margin-left: auto;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 10px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
}
.sidebar-bottom { padding: 12px 8px; border-top: 1px solid var(--border); }
.quarter-badge {
  margin: 8px 8px 0;
  background: rgba(0,212,170,0.08);
  border: 1px solid rgba(0,212,170,0.2);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 11px;
}
.quarter-badge .qb-label { color: var(--text3); text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; font-weight: 700; }
.quarter-badge .qb-period { color: var(--accent3); font-weight: 700; font-size: 13px; font-family: 'Syne', sans-serif; }

/* MAIN CONTENT */
.main-content {
  flex: 1;
  margin-left: 240px;
  min-height: 100vh;
  background: var(--bg);
}
.topbar {
  height: 60px;
  background: rgba(10,12,16,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar h2 { font-size: 16px; font-weight: 700; flex: 1; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }
.notification-dot {
  width: 8px; height: 8px;
  background: var(--danger);
  border-radius: 50%;
  position: absolute;
  top: -2px; right: -2px;
}
.page-content { padding: 24px; }

/* ---- PANELS ---- */
.panel { display: none; }
.panel.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

/* ---- CARDS ---- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 12px;
}
.card-header h3 { font-size: 15px; }
.card-title { font-size: 13px; color: var(--text2); margin-top: 2px; }

/* ---- STAT CARDS ---- */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
@media(max-width:1100px) { .stats-grid { grid-template-columns: repeat(2,1fr); } }
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 20px;
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 80px; height: 80px;
  border-radius: 50%;
  opacity: 0.08;
  transform: translate(20px, -20px);
}
.stat-card.blue::before { background: var(--accent); }
.stat-card.purple::before { background: var(--accent2); }
.stat-card.green::before { background: var(--accent3); }
.stat-card.gold::before { background: var(--gold); }
.stat-card .sc-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; margin-bottom: 8px; }
.stat-card .sc-value { font-size: 28px; font-weight: 800; font-family: 'Syne', sans-serif; line-height: 1; }
.stat-card.blue .sc-value { color: var(--accent); }
.stat-card.purple .sc-value { color: var(--accent2); }
.stat-card.green .sc-value { color: var(--accent3); }
.stat-card.gold .sc-value { color: var(--gold); }
.stat-card .sc-sub { font-size: 11px; color: var(--text3); margin-top: 6px; }

/* ---- TABLES ---- */
.table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; }
th {
  background: var(--surface2);
  padding: 10px 14px;
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text3);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }

/* ---- BADGES ---- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  font-family: 'Syne', sans-serif;
  white-space: nowrap;
}
.badge-pending { background: rgba(247,161,79,0.12); color: var(--warn); border: 1px solid rgba(247,161,79,0.3); }
.badge-approved { background: rgba(79,217,122,0.12); color: var(--success); border: 1px solid rgba(79,217,122,0.3); }
.badge-rejected { background: rgba(247,95,95,0.12); color: var(--danger); border: 1px solid rgba(247,95,95,0.3); }
.badge-draft { background: rgba(92,100,128,0.15); color: var(--text3); border: 1px solid var(--border); }
.badge-locked { background: rgba(124,92,252,0.12); color: var(--accent2); border: 1px solid rgba(124,92,252,0.3); }
.badge-ontrack { background: rgba(0,212,170,0.12); color: var(--accent3); border: 1px solid rgba(0,212,170,0.3); }
.badge-notstarted { background: rgba(92,100,128,0.15); color: var(--text3); border: 1px solid var(--border); }
.badge-completed { background: rgba(79,217,122,0.12); color: var(--success); border: 1px solid rgba(79,217,122,0.3); }
.badge-shared { background: rgba(79,142,247,0.12); color: var(--accent); border: 1px solid rgba(79,142,247,0.3); }

/* ---- PROGRESS BAR ---- */
.progress-wrap { background: var(--surface3); border-radius: 100px; height: 6px; overflow: hidden; }
.progress-fill {
  height: 100%;
  border-radius: 100px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width 0.5s ease;
}
.progress-fill.good { background: linear-gradient(90deg, var(--accent3), #00b89c); }
.progress-fill.warn { background: linear-gradient(90deg, var(--warn), #e8861e); }
.progress-fill.danger { background: linear-gradient(90deg, var(--danger), #d43333); }

/* ---- MODAL ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn 0.2s ease;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 16px;
  width: 640px;
  max-width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,0.7);
  animation: fadeUp 0.25s ease;
}
.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 1;
}
.modal-header h3 { font-size: 16px; }
.modal-body { padding: 20px 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}
.close-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 20px; padding: 4px; transition: color 0.2s; }
.close-btn:hover { color: var(--text); }

/* ---- GRID HELPERS ---- */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.flex-row { display: flex; align-items: center; gap: 10px; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.flex-wrap { flex-wrap: wrap; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
.text-muted { color: var(--text2); }
.text-muted2 { color: var(--text3); }
.text-accent { color: var(--accent); }
.text-success { color: var(--success); }
.text-danger { color: var(--danger); }
.text-warn { color: var(--warn); }
.divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.section-title { font-size: 14px; font-family: 'Syne', sans-serif; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section-title::after { content:''; flex:1; height:1px; background: var(--border); }

/* ---- GOAL ITEM ---- */
.goal-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}
.goal-item:hover { border-color: var(--border2); }
.goal-item.locked { opacity: 0.85; }
.goal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.goal-title-text { font-weight: 600; font-size: 14px; }
.goal-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.goal-meta-item { font-size: 11px; color: var(--text2); background: var(--surface3); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
.weightage-bar { margin-top: 8px; }
.weightage-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; display: flex; justify-content: space-between; }

/* ---- INLINE EDIT ---- */
.inline-input {
  background: var(--surface3);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 4px 8px;
  color: var(--text);
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  width: 100%;
  outline: none;
}
.inline-input:focus { border-color: var(--accent); }

/* ---- ALERT ---- */
.alert {
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 12px;
}
.alert-error { background: rgba(247,95,95,0.08); border: 1px solid rgba(247,95,95,0.25); color: #f5a0a0; }
.alert-success { background: rgba(79,217,122,0.08); border: 1px solid rgba(79,217,122,0.25); color: #8deaa9; }
.alert-warn { background: rgba(247,161,79,0.08); border: 1px solid rgba(247,161,79,0.25); color: #f5c688; }
.alert-info { background: rgba(79,142,247,0.08); border: 1px solid rgba(79,142,247,0.25); color: #8dbdf5; }

/* WEIGHTAGE TOTAL INDICATOR */
.weightage-total {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 16px;
}
.wt-label { font-size: 12px; color: var(--text3); }
.wt-value { font-size: 20px; font-weight: 800; font-family: 'Syne', sans-serif; }
.wt-ok { color: var(--success); }
.wt-warn { color: var(--warn); }
.wt-bar { flex: 1; margin: 0 16px; }

/* ---- TIMELINE ---- */
.timeline { position: relative; padding-left: 20px; }
.timeline::before { content:''; position:absolute; left:6px; top:0; bottom:0; width:2px; background:var(--border); border-radius:1px; }
.tl-item { position: relative; margin-bottom: 16px; }
.tl-item::before { content:''; position:absolute; left:-17px; top:5px; width:10px; height:10px; border-radius:50%; background:var(--surface2); border:2px solid var(--border2); }
.tl-item.active::before { background:var(--accent); border-color:var(--accent); box-shadow:0 0 8px rgba(79,142,247,0.5); }
.tl-item.done::before { background:var(--success); border-color:var(--success); }
.tl-date { font-size: 11px; color: var(--text3); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.tl-text { font-size: 13px; color: var(--text2); margin-top: 2px; }

/* ---- TOAST ---- */
#toastContainer {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 260px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  animation: slideIn 0.25s ease;
}
@keyframes slideIn { from { transform: translateX(100%); opacity:0; } to { transform:none; opacity:1; } }
.toast.out { animation: slideOut 0.3s ease forwards; }
@keyframes slideOut { to { transform: translateX(100%); opacity:0; } }
.toast-success { border-left: 3px solid var(--success); }

/* ---- REPORT / ANALYTICS ---- */
.chart-bar-wrap { display: flex; flex-direction: column; gap: 8px; }
.chart-bar-item { display: flex; align-items: center; gap: 12px; }
.chart-bar-label { font-size: 12px; color: var(--text2); width: 120px; text-align: right; }

/* SCORE */
.score-ring {
  width: 64px; height: 64px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 800;
  font-family: 'Syne', sans-serif;
  position: relative;
  flex-shrink: 0;
}
.score-ring::before {
  content: '';
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: var(--surface2);
}
.score-ring span { position: relative; z-index: 1; }

/* NOTIFICATION PANEL */

function myNotifs() { return state.notifications.filter(n=>n.userId===currUser().id); }

function computeScore(goal, quarter) {
  const ach = goal.achievements[quarter];
  if(!ach || ach.actual==='' || ach.actual===null || ach.actual===undefined) return null;
  const uom = goal.uom;
  const actual = parseFloat(ach.actual);
  const target = parseFloat(goal.target);
  let score = null;
  if(uom.includes('Min - Higher')) { score = Math.min((actual/target)*100, 150); }
  else if(uom.includes('Max - Lower')) { score = actual<=0 ? 150 : Math.min((target/actual)*100, 150); }
  else if(uom==='Timeline') {
    const d = new Date(ach.actual).getTime();
    const t = new Date(goal.targetDate || goal.target).getTime();
    score = d <= t ? 100 : Math.max(0, 100 - ((d-t)/(24*3600000)));
  }
  else if(uom==='Zero') { score = (actual===0) ? 100 : 0; }
  return score!==null ? Math.round(score) : null;
}

function updateApprovalBadge() {
  const b = document.getElementById('approvalBadge');
  if(!b) return;
  const cnt = getTeamGoals().filter(g=>g.status==='pending').length;
  b.textContent = cnt;
  b.style.display = cnt>0 ? 'inline' : 'none';
}

function showPanel(panelName) {
  state.activePanel = panelName;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const navEl = document.getElementById('nav-'+panelName);
  if(navEl) navEl.classList.add('active');
  const titleMap = {
    dashboard:'Dashboard', mygoals:'My Goals', achievements:'Achievement Tracking',
    teamgoals:'Team Goals', approvals:'Goal Approvals', checkins:'Quarterly Check-ins',
    reports:'Reports & Export', allgoals:'All Goals', cycle:'Cycle Configuration',
    sharedgoals:'Push Shared Goals', analytics:'Analytics', auditlog:'Audit Log',
    timeline:'Cycle Timeline', notifications:'Notifications'
  };
  document.getElementById('topbarTitle').textContent = titleMap[panelName]||panelName;
  const pc = document.getElementById('pageContent');

  const renders = {
    dashboard: renderDashboard,
    mygoals: renderMyGoals,
    achievements: renderAchievements,
    teamgoals: renderTeamGoals,
    approvals: renderApprovals,
    checkins: renderCheckins,
    reports: renderReports,
    allgoals: renderAllGoals,
    cycle: renderCycleConfig,
    sharedgoals: renderSharedGoals,
    analytics: renderAnalytics,
    auditlog: renderAuditLog,
    timeline: renderTimeline,
    notifications: renderNotifications,
  };
  if(renders[panelName]) pc.innerHTML = renders[panelName]();
  else pc.innerHTML = `<div class="empty-state"><div class="es-icon">🚧</div><h4>${panelName}</h4><p>Coming soon</p></div>`;
  updateApprovalBadge();
}

function calcAvgScore(goals, quarter) {
  const locked = goals.filter(g=>g.isLocked);
  if(!locked.length) return null;
  let total=0, cnt=0;
  locked.forEach(g=>{ const s=computeScore(g,quarter); if(s!==null){ total+=s*g.weightage/100; cnt++; } });
  return cnt>0 ? Math.round(total) : null;
}

function getMyGoalsFor(userId) { return state.goals.filter(g=>g.employeeId===userId); }

  return `<div class="goal-item ${locked?'locked':''}">
    <div class="goal-header">
      <div style="flex:1">
        <div class="goal-title-text">${g.title} ${g.isShared?'<span class="badge badge-shared">🔗 Shared</span>':''}</div>
        <div class="text-xs text-muted2 mt-8">${g.description}</div>
      </div>
      <div class="flex-row" style="flex-shrink:0">
        <span class="badge badge-${g.status==='approved'?(g.isLocked?'locked':'approved'):g.status==='pending'?'pending':g.status==='rejected'?'rejected':'draft'}">
          ${g.status==='approved'&&g.isLocked?'🔒 Locked':g.status==='approved'?'✅ Approved':g.status==='pending'?'⏳ Pending':g.status==='rejected'?'❌ Returned':'📝 Draft'}
        </span>
        ${canEdit?`<button class="btn btn-ghost btn-sm" onclick="openEditGoalModal('${g.id}')">✏️</button><button class="btn btn-danger btn-sm" onclick="deleteGoal('${g.id}')">🗑</button>`:''}

      </div>
    </div>
    <div class="goal-meta">
      <span class="goal-meta-item">📁 ${g.thrustArea}</span>
      <span class="goal-meta-item">📏 ${g.uom}</span>
      <span class="goal-meta-item">🎯 Target: ${g.uom==='Timeline'?fmtDate(g.target):g.target}</span>
      <span class="goal-meta-item">⚖️ ${g.weightage}%</span>
      ${g.status==='approved'?`<span class="goal-meta-item">✅ Approved by ${getUser(g.approvedBy)?.name||'Manager'}</span>`:''}
    </div>
    ${locked?`<div class="weightage-bar">
      <div class="weightage-label"><span>Q2 Progress</span><span style="font-weight:700">${computeScore(g,'q2')!==null?computeScore(g,'q2')+'%':'No data'}</span></div>

function submitAllGoals() {
  const goals = getMyGoals().filter(g=>g.status==='draft'||g.status==='rejected');
  const totalW = getMyGoals().reduce((s,g)=>s+(g.weightage||0),0);
  if(totalW!==100) { toast('Total weightage must equal 100%','error'); return; }
  goals.forEach(g=>{ g.status='pending'; g.submittedAt=new Date().toISOString(); });
  addAuditLog('Employee submitted goals for approval', goals.map(g=>g.id));
  const mgr = getUser(currUser().managerId);
  if(mgr) addNotif(mgr.id, 'pending_approval', `${currUser().name} has submitted ${goals.length} goal(s) for approval`);
  toast('Goals submitted for manager approval!','success');
  showPanel('mygoals');
}

function deleteGoal(goalId) {
  const idx = state.goals.findIndex(g=>g.id===goalId);
  if(idx<0) return;
  if(state.goals[idx].isLocked) { toast('Cannot delete a locked goal','error'); return; }
  state.goals.splice(idx,1);
  toast('Goal deleted','info');
  showPanel('mygoals');
}

function adminUnlockGoal(goalId) {
  const g = state.goals.find(g=>g.id===goalId);
  if(!g) return;
  g.isLocked = false;
  g.status = 'approved';
  addAuditLog(`Admin unlocked goal: ${g.title}`, [goalId]);
  toast('Goal unlocked by Admin','warn');
  showPanel('allgoals');
}

function saveGoal(editId=null) {
  const thrust = document.getElementById('gf_thrust').value;
  const title = document.getElementById('gf_title').value.trim();
  const desc = document.getElementById('gf_desc').value.trim();
  const uom = document.getElementById('gf_uom').value;
  const target = document.getElementById('gf_target').value.trim();
  const weight = parseInt(document.getElementById('gf_weight').value)||0;
  const date = document.getElementById('gf_date').value;
  const errEl = document.getElementById('goalFormError');

  if(!title) { errEl.innerHTML='<div class="alert alert-error">Goal title is required</div>'; return; }
  if(!target) { errEl.innerHTML='<div class="alert alert-error">Target is required</div>'; return; }
  if(weight<10) { errEl.innerHTML='<div class="alert alert-error">Minimum weightage per goal is 10%</div>'; return; }

  const allGoals = getMyGoals().filter(g=>g.id!==editId);
  const usedW = allGoals.reduce((s,g)=>s+(g.weightage||0),0);
  if(usedW+weight>100) { errEl.innerHTML=`<div class="alert alert-error">Total weightage would exceed 100% (currently ${usedW}% + ${weight}% = ${usedW+weight}%)</div>`; return; }

  if(editId) {
    const g = state.goals.find(g=>g.id===editId);
    if(g) {
      g.title=title; g.description=desc; g.thrustArea=thrust; g.uom=uom; g.target=target; g.targetDate=date; g.weightage=weight;
      addAuditLog(`Edited goal: ${title}`, [editId]);
      toast('Goal updated','success');
    }
  } else {
    const newG = {
      id:uid(), employeeId:currUser().id, title, description:desc, thrustArea:thrust, uom, target, targetDate:date, weightage:weight,
      status:'draft', isLocked:false, isShared:false, createdAt:new Date().toISOString(), cycleYear:2025,
      achievements:{ q1:{actual:'',status:'Not Started',comments:[]}, q2:{actual:'',status:'Not Started',comments:[]}, q3:{actual:'',status:'Not Started',comments:[]}, q4:{actual:'',status:'Not Started',comments:[]} }
    };
    state.goals.push(newG);
    addAuditLog(`Created goal: ${title}`, [newG.id]);
    toast('Goal added','success');
  }
  closeModal();
  showPanel('mygoals');
}

function renderAchievementRow(g, quarter) {
  const ach = g.achievements[quarter];
  const score = computeScore(g, quarter);
  const isTimeline = g.uom==='Timeline';
  const isZero = g.uom==='Zero';

  return `<div class="card">
    <div class="card-header">
      <div><h3 style="font-size:14px">${g.title}</h3><div class="text-xs text-muted2">${g.thrustArea} · ${g.uom} · Target: ${isTimeline?fmtDate(g.target):g.target} · Weightage: ${g.weightage}%</div></div>
      ${score!==null?`<div class="score-ring" style="background:conic-gradient(${score>=80?'var(--success)':score>=50?'var(--warn)':'var(--danger)'} ${score*3.6}deg, var(--surface3) 0deg)"><span>${score}%</span></div>`:''}
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label>${quarter.toUpperCase()} Actual Achievement</label>
        ${isTimeline?`<input type="date" value="${ach.actual||''}" onchange="updateAchievement('${g.id}','${quarter}','actual',this.value)"/>`
          :`<input type="${isZero?'number':'number'}" step="any" placeholder="${isZero?'0 = success':'Enter actual value'}" value="${ach.actual}" onchange="updateAchievement('${g.id}','${quarter}','actual',this.value)"/>`}
      </div>
      <div class="form-group">
        <label>Status</label>
        <select onchange="updateAchievement('${g.id}','${quarter}','status',this.value)">
          <option ${ach.status==='Not Started'?'selected':''}>Not Started</option>
          <option ${ach.status==='On Track'?'selected':''}>On Track</option>
          <option ${ach.status==='Completed'?'selected':''}>Completed</option>
        </select>
      </div>
    </div>
    ${score!==null?`<div class="weightage-bar"><div class="weightage-label"><span>Progress Score</span><span style="color:${score>=80?'var(--success)':score>=50?'var(--warn)':'var(--danger)'}; font-weight:700">${score}%</span></div><div class="progress-wrap"><div class="progress-fill ${score>=80?'good':score>=50?'':'warn'}" style="width:${Math.min(score,100)}%"></div></div></div>`:''}
    <div class="form-group mt-8"><button class="btn btn-success btn-sm" onclick="saveAchievement('${g.id}','${quarter}')">💾 Save Achievement</button></div>
  </div>`;
}

let tempAchievements = {};
function updateAchievement(goalId, quarter, field, value) {
  const key = goalId+'_'+quarter;
  if(!tempAchievements[key]) tempAchievements[key] = {};
  tempAchievements[key][field] = value;
}

function saveAchievement(goalId, quarter) {
  const g = state.goals.find(g=>g.id===goalId);
  if(!g) return;
  const key = goalId+'_'+quarter;
  const temp = tempAchievements[key]||{};

  // Read directly from DOM
  const parent = document.querySelector(`[data-goal-id="${goalId}"]`) || document.getElementById('achievementGoals');
  const cards = document.getElementById('achievementGoals').querySelectorAll('.card');
  let found = false;
  cards.forEach(card=>{
    if(card.innerHTML.includes(goalId)) {
      const inputs = card.querySelectorAll('input,select');
      if(inputs[0]) g.achievements[quarter].actual = inputs[0].value;
      if(inputs[1]) g.achievements[quarter].status = inputs[1].value;
      found = true;
    }
  });
  if(!found) {
    if(temp.actual!==undefined) g.achievements[quarter].actual = temp.actual;
    if(temp.status!==undefined) g.achievements[quarter].status = temp.status;
  }

  // Re-read from all inputs in the card
  const allCards = document.querySelectorAll('#achievementGoals .card');
  allCards.forEach(card=>{
    if(card.querySelector('h3')&&card.querySelector('h3').textContent.includes(g.title.slice(0,20))) {
      const inp = card.querySelectorAll('input');
      const sel = card.querySelectorAll('select');
      if(inp[0]&&inp[0].value!=='') g.achievements[quarter].actual = inp[0].value;
      if(sel[0]) g.achievements[quarter].status = sel[0].value;
    }
  });

  addAuditLog(`${quarter.toUpperCase()} achievement updated for goal: ${g.title}`, [goalId]);
  toast(`${quarter.toUpperCase()} achievement saved!`, 'success');
  showPanel('achievements');
}

function inlineEditGoal(goalId, field, value) {
  const g = state.goals.find(g=>g.id===goalId);
  if(g) { g[field]=value; addAuditLog(`Manager edited ${field} for goal: ${g.title}`, [goalId]); }
}

function approveGoal(goalId) {
  const g = state.goals.find(g=>g.id===goalId);
  if(!g) return;
  g.status='approved'; g.isLocked=true; g.approvedAt=new Date().toISOString(); g.approvedBy=currUser().id;
  addAuditLog(`Approved and locked goal: ${g.title}`, [goalId]);
  addNotif(g.employeeId, 'approval', `Your goal "${g.title}" has been approved by ${currUser().name}`);
  toast('Goal approved and locked','success');
  showPanel('approvals');
}

function approveAllFor(empId) {
  const goals = getTeamGoals().filter(g=>g.employeeId===empId&&g.status==='pending');
  // Validate total weightage
  const allEmpGoals = state.goals.filter(g=>g.employeeId===empId);
  const totalW = allEmpGoals.reduce((s,g)=>s+(g.weightage||0),0);
  if(totalW!==100) { toast(`Total weightage for ${getUser(empId)?.name} is ${totalW}% — must be 100%`,'error'); return; }
  goals.forEach(g=>{ g.status='approved'; g.isLocked=true; g.approvedAt=new Date().toISOString(); g.approvedBy=currUser().id; });
  addAuditLog(`Approved all goals for ${getUser(empId)?.name}`, goals.map(g=>g.id));
  addNotif(empId, 'approval', `All your goals have been approved by ${currUser().name}`);
  toast(`All goals for ${getUser(empId)?.name} approved and locked`,'success');
  showPanel('approvals');
}

  const mc = document.getElementById('modalContainer');
  mc.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-header"><h3>↩ Return Goals for Rework</h3><button class="close-btn" onclick="closeModal()">✕</button></div>

function pushSharedGoal() {
  const title = document.getElementById('sg_title').value.trim();
  const thrust = document.getElementById('sg_thrust').value;
  const uom = document.getElementById('sg_uom').value;
  const target = document.getElementById('sg_target').value.trim();
  const weight = parseInt(document.getElementById('sg_weight').value)||20;
  const empIds = USERS.filter(u=>u.role==='employee'&&document.getElementById('sg_emp_'+u.id)?.checked).map(u=>u.id);
  if(!title||!target) { toast('Title and target required','error'); return; }
  if(empIds.length===0) { toast('Select at least one employee','error'); return; }
  empIds.forEach(empId=>{
    const g = {
      id:uid(), employeeId:empId, title, description:'Shared departmental KPI', thrustArea:thrust, uom, target, targetDate:'2025-12-31', weightage:weight,
      status:'approved', isLocked:true, isShared:true, sharedBy:currUser().id, approvedBy:currUser().id, approvedAt:new Date().toISOString(), createdAt:new Date().toISOString(), cycleYear:2025,
      achievements:{ q1:{actual:'',status:'Not Started',comments:[]}, q2:{actual:'',status:'Not Started',comments:[]}, q3:{actual:'',status:'Not Started',comments:[]}, q4:{actual:'',status:'Not Started',comments:[]} }
    };
    state.goals.push(g);
    addNotif(empId,'shared_goal',`A shared goal "${title}" has been pushed to you by HR`);
  });
  addAuditLog(`Pushed shared goal "${title}" to ${empIds.length} employees`, []);
  toast(`Shared goal pushed to ${empIds.length} employees`,'success');
  showPanel('sharedgoals');
}

function renderAnalytics() {
  const goals = state.goals;
  const byThrust = {};
  THRUST_AREAS.forEach(t=>{ byThrust[t]=goals.filter(g=>g.thrustArea===t).length; });

  const depts = ['Engineering','Sales'];
  const q1Avg = depts.map(d=>{ const dg=goals.filter(g=>getUser(g.employeeId)?.dept===d&&g.isLocked); return {dept:d, avg:calcAvgScore(dg,'q1')||0}; });
  const q2Avg = depts.map(d=>{ const dg=goals.filter(g=>getUser(g.employeeId)?.dept===d&&g.isLocked); return {dept:d, avg:calcAvgScore(dg,'q2')||0}; });

  return `
  <div class="stats-grid">

    <div class="stat-card green"><div class="sc-label">Approved & Tracked</div><div class="sc-value">${goals.filter(g=>g.isLocked).length}</div></div>

  </div>
  <div class="grid-2">
    <div class="card">
      <div class="card-header"><h3>📊 Goals by Thrust Area</h3></div>
      <div class="chart-bar-wrap">
        ${Object.entries(byThrust).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
          const maxV = Math.max(...Object.values(byThrust));
          const pct = Math.round((v/maxV)*100);
          const colors=['var(--accent)','var(--accent2)','var(--accent3)','var(--gold)','var(--warn)'];
          const col = colors[Object.keys(byThrust).indexOf(k)%colors.length];
          return `<div class="chart-bar-item">
            <div class="chart-bar-label">${k.length>18?k.slice(0,18)+'…':k}</div>
            <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${pct}%;background:${col}">${v}</div></div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-header"><h3>📈 QoQ Score Trends by Dept</h3></div>
      <div style="margin-bottom:16px">
        <div class="text-xs text-muted2 mb-8">Q1 vs Q2 Achievement Scores</div>

          const q1 = q1Avg.find(x=>x.dept===d)?.avg||0;
          const q2 = q2Avg.find(x=>x.dept===d)?.avg||0;
          const trend = q2>q1?'↑':'↓';
          const trendCol = q2>q1?'var(--success)':'var(--danger)';
          return `<div style="margin-bottom:16px">
            <div class="flex-between mb-8">
              <span style="font-weight:600">${d}</span>
              <span style="color:${trendCol};font-weight:700">${trend} Q1: ${q1}% → Q2: ${q2}%</span>
            </div>
            <div class="chart-bar-item">
              <div class="chart-bar-label">Q1</div>
              <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${q1}%;background:var(--accent2)">${q1}%</div></div>
            </div>
            <div class="chart-bar-item" style="margin-top:4px">
              <div class="chart-bar-label">Q2</div>
              <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${q2}%;background:var(--accent3)">${q2}%</div></div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <hr class="divider"/>
      <div class="card-header"><h3>🗂 UoM Distribution</h3></div>
      <div class="chart-bar-wrap">
        ${Object.entries(byUom).filter(([,v])=>v>0).map(([k,v])=>{
          const maxV = Math.max(...Object.values(byUom));
          return `<div class="chart-bar-item">
            <div class="chart-bar-label">${k.split('(')[0].trim()}</div>
            <div class="chart-bar-track"><div class="chart-bar-fill" style="width:${Math.round((v/maxV)*100)}%;background:var(--accent)">${v}</div></div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-header"><h3>👔 Manager Effectiveness — Check-in Completion</h3></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Manager</th><th>Team Size</th><th>Goals Approved</th><th>Q2 Check-ins Done</th><th>Completion Rate</th></tr></thead>
      <tbody>
        ${USERS.filter(u=>u.role==='manager').map(mgr=>{
          const team = USERS.filter(u=>u.managerId===mgr.id);
          const mGoals = state.goals.filter(g=>{ const e=getUser(g.employeeId); return e&&e.managerId===mgr.id&&g.isLocked; });
          const checked = mGoals.filter(g=>g.achievements.q2.managerComment).length;
          const rate = mGoals.length>0?Math.round((checked/mGoals.length)*100):0;
          return `<tr>

            <td>${team.length}</td>

                <span style="font-weight:700">${rate}%</span>
              </div>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>
  </div>`;
}

function exportCSV() {
  const goals = isAdmin() ? state.goals : getTeamGoals();
  const locked = goals.filter(g=>g.isLocked);
  const rows = [['Employee','Dept','Goal','Thrust Area','UoM','Target','Q1 Actual','Q1 Score','Q2 Actual','Q2 Score','Q2 Status']];
  locked.forEach(g=>{
    const emp=getUser(g.employeeId);
    rows.push([emp?.name,emp?.dept,g.title,g.thrustArea,g.uom,g.target,g.achievements.q1.actual||'',computeScore(g,'q1')!==null?computeScore(g,'q1')+'%':'',g.achievements.q2.actual||'',computeScore(g,'q2')!==null?computeScore(g,'q2')+'%':'',g.achievements.q2.status||'Not Started']);
  });
  const csv = rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'achievement_report_q2_2025.csv';
  a.click();
  toast('CSV exported!','success');
}

            {icon:'🔒', text:'Goals are locked after manager approval — no further edits without Admin'},
            {icon:'🔗', text:'Shared goals: weightage adjustable, title and target are read-only'},
          ].map(r=>`<div class="flex-row" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px">
            <span>${r.icon}</span><span class="text-sm">${r.text}</span>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

// ============================================================
// NOTIFICATIONS
// ============================================================
function renderNotifications() {
  const notifs = myNotifs();
  notifs.forEach(n=>n.read=true);
  renderNotifCount();
  const icons = { pending_approval:'⏳', approval:'✅', rejection:'❌', checkin:'📝', shared_goal:'🔗', default:'🔔' };
  const colors = { pending_approval:'rgba(247,161,79,0.1)', approval:'rgba(79,217,122,0.1)', rejection:'rgba(247,95,95,0.1)', checkin:'rgba(79,142,247,0.1)', shared_goal:'rgba(124,92,252,0.1)' };

  return `
  <div class="card">
    <div class="card-header"><h3>🔔 Notifications</h3><span class="text-xs text-muted2">${notifs.length} total</span></div>
    ${notifs.length===0?`<div class="empty-state" style="padding:24px"><div class="es-icon">🔕</div><h4>No Notifications</h4></div>`:''}
    ${notifs.map(n=>`<div class="notif-item">
      <div class="notif-icon" style="background:${colors[n.type]||'var(--surface2)'}">${icons[n.type]||icons.default}</div>
      <div class="notif-info">
        <div class="notif-title">${n.message}</div>
        <div class="notif-sub">${fmtDate(n.timestamp)} ${new Date(n.timestamp).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
    </div>`).join('')}
  </div>`;
}

// ============================================================
// MODAL HELPERS
// ============================================================
function closeModal() {
  document.getElementById('modalContainer').innerHTML='';
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

// ============================================================
// BOOTSTRAP
// ============================================================
window.onload = function() {
  selectRole('employee');
};
</script>
</body>
